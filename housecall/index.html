        class pipeNext extends Phaser.Physics.Arcade.Sprite
        {
            constructor(scene, x, y, key, fromLevel, gameManager) 
            {
                super(scene, x, y, "pipe");

                this.pipe = scene.physics.add.sprite(x, y, "pipe");
                this.pipe.setOrigin(0, 1);
                this.pipe.body.allowGravity = false;
                this.pipe.body.setImmovable(true);
                this.pipe.setDepth(999999998);
                
                if(!scene.anims.get("stabAnim"))
                {
                    scene.anims.create
                    ({
                        key: "stabAnim",
                        frames: this.anims.generateFrameNumbers("stab", {start: 0, end: 2 }),
                        frameRate: 2,
                        repeat: 0
                    });
                }
                
                scene.stab = scene.add.sprite(this.pipe.x + 1, this.pipe.y, "stab").setOrigin(0, 1);
                scene.stab.setActive(false);
                scene.stab.setVisible(false);
                scene.stab.setDepth(999999998);
                scene.hasPlayedStabAnimtation = false;

                scene.physics.add.overlap(this.pipe, scene.player, (pipe, player) =>
                {
                    if(scene.hasPlayedStabAnimtation === false)
                    {
                        scene.hasPlayedStabAnimtation = true;
                        player.destroy();
                        resetCrosshairIfDifferent();
                        scene.stab.setActive(true);
                        scene.stab.setVisible(true);
                        canPlayAudio(scene) && scene.sound.play("powerup");

                        scene.stab.on(Phaser.Animations.Events.ANIMATION_UPDATE, (anim, frame) => 
                        {
                            if(frame.index === 2) 
                            {
                                let aCultActive = false;
                                canPlayAudio(scene) && scene.sound.play("stab");

                                if(scene.cults && scene.cults.children.entries)
                                {
                                    const cultsArray = scene.cults.children.entries; 

                                    for(let i = cultsArray.length - 1; i >= 0; i--) 
                                    {
                                        const cult = cultsArray[i];
                                        aCultActive = true;
                                        cult.hitFrom = "pipe";
                                        cult.kill();  
                                    }
                                }

                                if(scene.cultKnifes && scene.cultKnifes.children.entries)
                                {
                                    const cultKnifesArray = scene.cultKnifes.children.entries; 

                                    for(let i = cultKnifesArray.length - 1; i >= 0; i--) 
                                    {
                                        const cultKnife = cultKnifesArray[i];
                                        aCultActive = true;
                                        cult.hitFrom = "pipe";
                                        cultKnife.kill();  
                                    }
                                }

                                if(scene.eyes && scene.eyes.children.entries)
                                {
                                    const eyesArray = scene.eyes.children.entries; 

                                    for(let i = eyesArray.length - 1; i >= 0; i--) 
                                    {
                                        const eye = eyesArray[i];
                                        aCultActive = true;
                                        cult.hitFrom = "pipe";
                                        eye.kill();  
                                    }
                                }

                                if(aCultActive)
                                {
                                    canPlayAudio(scene) && scene.sound.play("hurt");
                                }
                            }
                        });

                        scene.stab.play("stabAnim", true);
                    }
                });
                
                scene.stab.off(Phaser.Animations.Events.ANIMATION_COMPLETE);

                scene.stab.on(Phaser.Animations.Events.ANIMATION_COMPLETE, () => 
                {
                    transitionLevels(scene, gameManager);
                });
                
                this.pipe.on("destroy", () => 
                {
                    scene.stab.off(Phaser.Animations.Events.ANIMATION_UPDATE);
                    scene.stab.off(Phaser.Animations.Events.ANIMATION_COMPLETE);
                });
            }
        }
  
        function transitionLevels(scene, gameManager)
        {
            if(levelIsTransitioning === false)
            {
                levelIsTransitioning = true;
                
                if(gameManager.currentLevel === 1)
                {
                    if(gameManager.visitedUpgradeRoom1 === true)
                    {
                        gameManager.currentLevel = 2;
                        scene.scene.start("Level2Game");
                        scene.scene.launch("HUD");
                    }
                    else
                    {
                        gameManager.visitedUpgradeRoom1 = true;
                        scene.scene.start("UpgradeRoom");
                        scene.scene.stop("HUD");
                    }
                }
                else if(gameManager.currentLevel === 2)
                {
                    if(gameManager.visitedUpgradeRoom2 === true)
                    {
                        gameManager.currentLevel = 3;
                        scene.scene.start("Level3Game");
                        scene.scene.launch("HUD");
                    }
                    else
                    {
                        gameManager.visitedUpgradeRoom2 = true;
                        scene.scene.start("UpgradeRoom");
                        scene.scene.stop("HUD");
                    }
                }
                else if(gameManager.currentLevel === 3)
                {
                    if(gameManager.visitedUpgradeRoom3 === true)
                    {
                        gameManager.currentLevel = 4;
                        scene.scene.start("Level4Game");
                        scene.scene.launch("HUD");
                    }
                    else
                    {
                        gameManager.visitedUpgradeRoom3 = true;
                        scene.scene.start("UpgradeRoom");
                        scene.scene.stop("HUD");
                    }
                }
                else if(gameManager.currentLevel === 4)
                {
                    gameManager.currentLevel = 1;
                    scene.scene.stop("HUD");
                    scene.gameManager.reset();
                    scene.scene.start("Level1Game");
                    scene.scene.launch("HUD");
                }
            }
        }
        
        function goBackALevel(scene, gameManager)
        {
            if(levelIsTransitioning === false)
            {
                levelIsTransitioning = true;
                
                if(gameManager.currentLevel === 1)
                {
                    gameManager.currentLevel = 1;
                    scene.scene.stop("Level1Game");
                    scene.scene.stop("HUD");
                    scene.scene.start("Level1Game");
                    scene.scene.launch("HUD");
                }
                else if(gameManager.currentLevel === 2)
                {
                    gameManager.currentLevel = 1;
                    scene.scene.stop("Level2Game");
                    scene.scene.stop("HUD");
                    scene.scene.start("Level1Game");
                    scene.scene.launch("HUD");
                }
                else if(gameManager.currentLevel === 3)
                {
                    gameManager.currentLevel = 2;
                    scene.scene.stop("Level3Game");
                    scene.scene.stop("HUD");
                    scene.scene.start("Level2Game");
                    scene.scene.launch("HUD");
                }
                else if(gameManager.currentLevel === 4)
                {
                    gameManager.currentLevel = 3;
                    scene.scene.stop("Level4Game");
                    scene.scene.stop("HUD");
                    scene.scene.start("Level3Game");
                    scene.scene.launch("HUD");
                }
            }
        }
        
        class Crosshair extends Phaser.Scene
        {
            constructor()
            {
                super({key: "Crosshair"});
            }
            
            create()
            {
                this.gameManager = this.scene.get("GameManager");
                this.settings = this.scene.get("Settings");
                
                this.crosshair = this.add.sprite
                (
                    0,
                    0,
                    "crosshair"
                );
                
                if(!this.anims.get("crosshairrotateRightFirst"))
                {
                    this.anims.create
                    ({
                        key: "crosshairrotateRightFirst",
                        frames: [
                                    { key: "crosshair", frame: 3 },
                                    { key: "crosshair", frame: 2 },
                                    { key: "crosshair", frame: 1 },
                                    { key: "crosshair", frame: 4 },
                                    { key: "crosshair", frame: 3 },
                                    { key: "crosshair", frame: 2 },
                                    { key: "crosshair", frame: 1 },
                                    { key: "crosshair", frame: 0 }
                                ],
                        frameRate: 72,
                        repeat: 0
                    });
                }
                
                if(!this.anims.get("crosshairrotateLeftFirst"))
                {
                    this.anims.create
                    ({
                        key: "crosshairrotateLeftFirst",
                        frames: [
                                    { key: "crosshair", frame: 1 },
                                    { key: "crosshair", frame: 2 },
                                    { key: "crosshair", frame: 3 },
                                    { key: "crosshair", frame: 4 }
                                ],
                        frameRate: 36,
                        repeat: 0
                    });
                }
                
                this.events.on("preupdate", (time, delta) => 
                {
                    this.crosshair.x = this.input.activePointer.x;
                    this.crosshair.y = this.input.activePointer.y;
                });
            }
            
            rotateCrosshairRight()
            {
                if(this.rotatedLeft)
                {
                    if(this.gameManager.crosshairMotion === "Animated")
                    {
                        this.crosshair.play("crosshairrotateRightFirst", true);
                        this.rotatedLeft = false;
                    }
                    else if(this.gameManager.crosshairMotion === "Instant" || this.gameManager.crosshairMotion === "Hybrid")
                    {
                        this.crosshair.stop();
                        this.crosshair.setFrame(0);
                        this.rotatedLeft = false;
                    }
                }
            }
            
            rotateCrosshairLeft()
            {
                if(!this.settings.displayedSettings)
                {
                    if(this.gameManager.crosshairMotion === "Animated" || this.gameManager.crosshairMotion === "Hybrid")
                    {
                        this.crosshair.play("crosshairrotateLeftFirst", true);
                        this.rotatedLeft = true;
                    }
                    else if(this.gameManager.crosshairMotion === "Instant")
                    {
                        this.crosshair.stop();
                        this.crosshair.setFrame(4);
                        this.rotatedLeft = true;
                    } 
                }
            }
            
            update()
            {
                
            }
        }

        function resetCrosshairIfDifferent()
        {
            if(game.scene.getScene("Crosshair"))
            {
                if(game.scene.getScene("Crosshair").rotatedLeft)
                {
                    game.scene.getScene("Crosshair").rotateCrosshairRight();
                }
            }
        }
        
        function restartToMainMenu(scene)
        {
            if(levelIsTransitioning === false)
            {
                levelIsTransitioning = true;
                scene.gameManager.reset();
                scene.gameManager.currentLevel = 0;
                const activeScenes = scene.scene.manager.getScenes(true);
                activeScenes.forEach(s => 
                {
                    const key = s.scene.key;

                    if (key !== "GameManager" && key !== "Settings" && key !== "Crosshair") 
                    {
                        scene.scene.stop(key);
                    }
                });

                scene.scene.launch("MainMenu");

                scene.scene.sendToBack("MainMenu");
                scene.scene.bringToTop("Settings");
                scene.scene.bringToTop("Crosshair");
                resetCrosshairIfDifferent();
            }
        }

            }
        }
        
        class Wheat
        {
            constructor(scene, worldWidthX)
            {    
                this.maxFrames = 2;        
                this.width = worldWidthX;
                this.scene = scene;
                this.direction = 1;
                this.currentFrameIndex = 0;
                this.delay = 300;
                this.timeAlive = 0;
                this.create();
                this.scene.events.on("update", this.update, this);
                this.scene.events.once("shutdown", () => 
                {
                    this.scene.events.off("update", this.update, this);
                });
            }

            create() 
            {
                this.scene.wheat = this.scene.add.tileSprite(0, this.scene.sys.game.config.height - 16, this.width, 16, "wheat", this.currentFrameIndex).setOrigin(0, 1).setScrollFactor(0.575);
            }

            update(time, delta) 
            {
                this.timeAlive += delta;
                
                if(this.timeAlive >= this.delay)
                {
                    while(this.timeAlive >= this.delay) 
                    {
                        this.timeAlive -= this.delay;
                    }
                    
                    let currentFrame = this.currentFrameIndex;

                    if(currentFrame === this.maxFrames - 1 && this.direction === 1) 
                    { 
                        this.direction = -1; 
                    } 
                    else if (currentFrame === 0 && this.direction === -1) 
                    {
                        this.direction = 1;  
                    }

                    let nextFrameIndex = currentFrame + this.direction;

                    this.scene.wheat.setFrame(nextFrameIndex);
                    this.currentFrameIndex = nextFrameIndex; 
                    this.scene.wheat.tilePositionX += 16; 

                    if(this.scene.wheat.tilePositionX >= 16 * this.maxFrames)
                    {
                        this.scene.wheat.tilePositionX = 0;
                    }
                }
            }
        }
        
        class Ground
        {
            constructor(scene, worldWidthX)
            {
                this.maxFrames = 2;        
                this.width = worldWidthX;
                this.scene = scene;
                this.direction = 1;
                this.currentFrameIndex = 0;
                this.delay = 300;
                this.timeAlive = 0;
                this.create();
                this.scene.events.on("update", this.update, this);
                this.scene.events.once("shutdown", () => 
                {
                    this.scene.events.off("update", this.update, this);
                });
            }

            create() 
            {
                this.scene.groundBotom = this.scene.add.tileSprite(0, this.scene.sys.game.config.height + 16, this.width * 2, 32, "ground").setOrigin(0, 1).setDepth(999999999);
                this.scene.physics.add.existing(this.scene.groundBotom);
                
                if(this.scene.groundBotom.body) 
                {
                    this.scene.groundBotom.body.setImmovable(true);
                    this.scene.groundBotom.body.allowGravity = false;
                }

                this.scene.grassTop = this.scene.add.tileSprite(0, this.scene.sys.game.config.height - 16, this.width, 16, "grasstop", this.currentFrameIndex);
                this.scene.grassTop.setOrigin(0, 1).setDepth(999999999);

                if(this.scene.player)
                {
                    this.scene.physics.add.collider(this.scene.player, this.scene.groundBotom);
                }
                
                if(this.scene.cults)
                {
                    this.scene.physics.add.collider(this.scene.cults, this.scene.groundBotom);
                }
                
                if(this.scene.cultKnifes)
                {
                    this.scene.physics.add.collider(this.scene.cultKnifes, this.scene.groundBotom);
                }
            }

            update(time, delta) 
            {
                this.timeAlive += delta;
                
                if(this.timeAlive >= this.delay)
                {
                    while(this.timeAlive >= this.delay) 
                    {
                        this.timeAlive -= this.delay;
                    }
                    
                    let currentFrame = this.currentFrameIndex;

                    if(currentFrame === this.maxFrames - 1 && this.direction === 1) 
                    { 
                        this.direction = -1; 
                    } 
                    else if(currentFrame === 0 && this.direction === -1) 
                    {
                        this.direction = 1;  
                    }

                    let nextFrameIndex = currentFrame + this.direction;

                    this.scene.grassTop.setFrame(nextFrameIndex);
                    
                    this.currentFrameIndex = nextFrameIndex; 
                    
                    this.scene.grassTop.tilePositionX += 32; 
                    
                    if(this.scene.grassTop.tilePositionX >= 32 * this.maxFrames)
                    {
                        this.scene.grassTop.tilePositionX = 0;
                    }
                }
            }
        }
        
        class Sky
        {
            constructor(scene, worldWidthX, texture)
            { 
                this.width = worldWidthX;
                this.scene = scene;
                this.delay = 300;
                this.scrollAmount = 1;
                this.timeAlive = 0;
                this.texture = texture;
                this.create();
                this.scene.events.on("update", this.update, this);
                this.scene.events.once("shutdown", () => 
                {
                    this.scene.events.off("update", this.update, this);
                });
            }

            create() 
            {
                this.scene.sky = this.scene.add.tileSprite(0, -32, this.width, this.scene.sys.game.config.height + 32, this.texture).setOrigin(0, 0);
                this.scene.sky.setScrollFactor(0.1);
            }

            update(time, delta) 
            {
                this.timeAlive += delta;
                
                if(this.timeAlive >= this.delay)
                {
                    while(this.timeAlive >= this.delay) 
                    {
                        this.timeAlive -= this.delay;
                    }
                    
                    this.scene.sky.tilePositionX += this.scrollAmount;
                }
            }
        }
    
        class MainMenu extends Phaser.Scene

            preload()

            create ()
            {
                //START BASIC SETUP MainMenu


                levelIsTransitioning = false;
                this.input.setDefaultCursor("");
                const worldWidthX = this.sys.game.config.width * 3;
                this.physics.world.setBounds(0, 0, (worldWidthX / 3), 176);

                this.gameManager = this.scene.get("GameManager");

            getActionAssignment(actionName)
            {
                let currentAction = this.gameManager.actions[actionName];
                
                if(currentAction.type === "KEY") 
                {
                    let name = this.keyNameLookup[currentAction.code];
                    
                    if(name === "LEFT")
                    {
                        return "Left-Arrow";
                    }
                    else if(name === "RIGHT")
                    {
                        return "Right-Arrow";
                    }
                    else if(name === "UP")
                    {
                        return "Up-Arrow";
                    }
                    else if(name === "DOWN")
                    {
                        return "Down-Arrow";
                    }
                    
                    try
                    {
                        return name.split("_").map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join("-");
                    }
                    catch(e)
                    {
                        return name;
                    }
                } 
                else 
                {
                    if(currentAction.button === 0)
                    {
                        return "Left-Mouse";
                    }
                    else if(currentAction.button === 1)
                    {
                        return "Middle-Mouse";
                    }
                    else if(currentAction.button === 2)
                    {
                        return "Right-Mouse";
                    }
                    else
                    {
                        return "undefined";
                    }
                }
            }

        {

            [
                "shed", "fence", "couch", "grill", "groundBotom", "grassTop", "wheat", "cross", "barn", "silo", "tractor", "copcar"
            ];

        function createRandomEnemies(scene, spawnList, worldWidthX, gameManager)
        {
            function getRandomCoords(worldWidthX) 
            {
                let min = 600;
                return Math.floor(Math.random() * (worldWidthX - min + 1)) + min;
            }

            function positionTaken(xCoord, chosenPositions, range)
            {
                for(const position of chosenPositions) 
                {
                    if(Math.abs(position - xCoord) <= range) 
                    {
                        return true;
                    }
                }

                return false;
            }

            const enemyData = new Map();

            for (const enemy of spawnList) 
            {
                const currentEnemy = enemy.type;
                const enemyAmount = enemy.amount;

                let positions = new Array();

                if(currentEnemy === "cult")
                {
                    const chosenPositions = new Set();

                    for(let i = 0; i < enemyAmount; i++)
                    {
                        let range = 8;
                        let xCoord;

                        do
                        {
                            xCoord = getRandomCoords(worldWidthX);
                        }
                        while(positionTaken(xCoord, chosenPositions, range));

                        const newCult = { x: xCoord, y: 100 };
                        chosenPositions.add(xCoord);
                        positions.push(newCult);
                    }

                    enemyData.set("cult", { positions: positions });
                    cultCreator(scene, positions, gameManager);
                }    
                else if(currentEnemy === "cultKnife")
                {
                    const chosenPositions = new Set();

                    for(let i = 0; i < enemyAmount; i++)
                    {
                        let range = 8;
                        let xCoord;

                        do
                        {
                            xCoord = getRandomCoords(worldWidthX);
                        }
                        while(positionTaken(xCoord, chosenPositions, range));

                        const newCultKnife = { x: xCoord, y: 100 };
                        chosenPositions.add(xCoord);
                        positions.push(newCultKnife);
                    }

                    enemyData.set("cultKnife", { positions: positions });
                    cultKnifeCreator(scene, positions, gameManager);
                }
                else if(currentEnemy === "eye")
                {
                    const chosenPositions = new Set();

                    for(let i = 0; i < enemyAmount; i++)
                    {
                        let range = 16;
                        let xCoord;

                        do
                        {
                            xCoord = getRandomCoords(worldWidthX);
                        }
                        while(positionTaken(xCoord, chosenPositions, range));

                        const newEye = { x: xCoord, y: 88 };
                        chosenPositions.add(xCoord);
                        positions.push(newEye);
                    }

                    enemyData.set("eye", { positions: positions });
                    eyeCreator(scene, positions, gameManager);
                }
            }

            return enemyData;
        }

        class UpgradeRoom extends Phaser.Scene
        {
            constructor()
            {
                super({key: "UpgradeRoom"});
                
                this.gameManager = game.scene.getScene("GameManager");
                
                this.cardAmount = Object.keys(this.gameManager.upgradeCardData).length;
                this.upgradeCardData = this.gameManager.upgradeCardData;
            }

            create()
            {
                levelIsTransitioning = false;
                this.settings = this.scene.get("Settings");
                this.input.setDefaultCursor("pointer");
                this.canAcceptCard = true;
                

                //START CARD SETUP

                
                this.card1 = null;
                this.card2 = null;

                do
                {
                    this.card1 = this.getRandomCardId();
                }
                while(this.gameManager.ownedCards.has(this.card1) || (this.gameManager.multiAmmoUpgrade === true && this.gameManager.ammoUpgrades.has(this.card1) && this.gameManager.gameMode !== "Classic"))

                do
                {
                    this.card2 = this.getRandomCardId();
                }
                while(this.card2 === this.card1 || this.gameManager.ownedCards.has(this.card2) || (this.gameManager.ammoUpgrades.has(this.card1) && this.gameManager.ammoUpgrades.has(this.card2))|| (this.gameManager.multiAmmoUpgrade === true && this.gameManager.ammoUpgrades.has(this.card2) && this.gameManager.gameMode !== "Classic"))

                this.cardDisplay1 = this.displayCard(this.card1, "left");
                this.cardDisplay1.on("pointerdown", () =>
                {
                    if(this.cardDisplay1.getBounds().contains(this.input.activePointer.x, this.input.activePointer.y) && !this.settings.displayedSettings) 
                    {
                        if(this.canAcceptCard)
                        {
                            this.canAcceptCard = false;
                            disableUncleanMouseActions = true;
                            this.acceptCard(this.card1);
                        }
                        
                    }
                });

                this.cardDisplay2 = this.displayCard(this.card2, "right");
                this.cardDisplay2.on("pointerdown", () =>
                {
                    if(this.cardDisplay2.getBounds().contains(this.input.activePointer.x, this.input.activePointer.y) && !this.settings.displayedSettings) 
                    {
                        if(this.canAcceptCard)
                        {
                            this.canAcceptCard = false;
                            disableUncleanMouseActions = true;
                            this.acceptCard(this.card2);
                        }
                    }
                });
                
                this.displayedCards = [this.cardDisplay1, this.cardDisplay2];
                
                
                //END CARD SETUP
            }

            update(time, delta)
            {
                if(this.settings.displayedSettings === true)
                {
                    if(this.input.enabled) 
                    {
                        this.input.enabled = false;
                        this.input.setDefaultCursor("default");
                    }
                }
                else
                {
                    if(!this.input.enabled) 
                    {
                        this.input.enabled = true;
                        this.input.setDefaultCursor("pointer");
                    }
                }
                
                if(this.displayedCards)
                {
                    this.displayedCards.forEach(card => 
                    {
                        if(card)
                        {
                            if(card.active)
                            {
                                if(card.getBounds().contains(this.input.activePointer.x, this.input.activePointer.y) && !this.settings.displayedSettings) 
                                {
                                    card.setAlpha(1);
                                    card.icon.setAlpha(1);
                                }   
                                else
                                {
                                    card.setAlpha(0.5);
                                    card.icon.setAlpha(0.5);
                                }
                            }
                        }
                    });
                }
            }

            acceptCard(id)
            {
                canPlayAudio(this) && this.sound.play("mainmenuclick", { rate: 2 });
                const card = Object.values(this.upgradeCardData).find(c => c.id === id);
                card.effect(this.gameManager);
                this.gameManager.ownedCards.add(id); 
                transitionLevels(this, this.gameManager);
            }
cou
            getRandomCardId()
            {
                return Math.floor(Math.random() * (this.cardAmount - 1 + 1)) + 1;
            }
            
            getNewAmmoStatFromCurrent(card)
            {     
                let currentAmmoType = this.gameManager.fireModeConfig[this.gameManager.fireModeUpgrade];
                
                let selectedAmmoType = this.gameManager.fireModeConfig[Object.keys(this.upgradeCardData).find(key => this.upgradeCardData[key] === card)];
                
                let damageDiff = (Math.round(selectedAmmoType.damage * 100) - Math.round(currentAmmoType.damage * 100)) / 100;
                let projectileDiff = (Math.round(selectedAmmoType.pelletCount * 100) - Math.round(currentAmmoType.pelletCount * 100)) / 100;
                let spreadDiff = (Math.round(selectedAmmoType.spread * 100) - Math.round(currentAmmoType.spread * 100)) / 100;
                let penetrationDiff = (Math.round(selectedAmmoType.penetrations * 100) - Math.round(currentAmmoType.penetrations * 100)) / 100;
                
                function normalize(value)
                {
                    if(value > 0)
                    {
                        return "+" + value;
                    }
                    else if(value === 0)
                    {
                        return "same";
                    }
                    else
                    {
                        return "" + value;
                    }
                }
                
                let spreadDisplayText = normalize(spreadDiff) + "°";
                
                if(card.name === "Slugs")
                {
                    spreadDisplayText = "none";
                }
                
                return "Damage: " + normalize(damageDiff) + ", Projectiles: " + normalize(projectileDiff) + ", Spread: " + spreadDisplayText + ", Penetrations: " + normalize(penetrationDiff);
                
                
            }

            displayCard(id, position)
            {
                const card = Object.values(this.upgradeCardData).find(c => c.id === id);
                let titleText;
                let descriptionText;
                let icon;
                let xPos;
                const yCenter = this.sys.game.config.height / 2;

                if(position === "left")
                {
                    xPos = this.sys.game.config.width / 4;
                }
                else
                {
                    xPos = (this.sys.game.config.width / 4) * 3;
                }

                const cardContainer = this.add.container(xPos, yCenter);
                titleText = createText(this, 0, -50, card.name, 20, "#f00").setOrigin(0.5, 1);
                
                if(card.ammo === true && this.gameManager.gameMode !== "Classic")
                {
                    descriptionText = createText(this, 0, 50, this.getNewAmmoStatFromCurrent(card), 10, "#f00").setOrigin(0.5, 0);
                }
                else
                {
                    descriptionText = createText(this, 0, 50, card.description, 10, "#f00").setOrigin(0.5, 0);
                }
                descriptionText.setStyle
                ({
                    wordWrap: { width: this.sys.game.config.width / 2 - 10, use:"true" }
                });

                if(card.icon)
                {
                    icon = this.add.image
                    (
                      xPos,
                      yCenter,
                      card.icon
                    ).setOrigin(0.5, 0.5);
                }

                cardContainer.add([titleText, descriptionText]);
                cardContainer.icon = icon;

                const hitAreaWidth = this.sys.game.config.width / 2;
                const hitAreaHeight = this.sys.game.config.height;

                const hitArea = new Phaser.Geom.Rectangle
                (
                    -hitAreaWidth / 2,
                    -hitAreaHeight / 2,
                    hitAreaWidth,
                    hitAreaHeight
                );

                cardContainer.setInteractive(hitArea, Phaser.Geom.Rectangle.Contains);

                return cardContainer;
            }

            refreshControls() 
            {
                if(this.keys) 
                {
                    for(let action in this.keys) 
                    {
                        this.input.keyboard.removeKey(this.keys[action]);
                    }
                }

                this.keys = {};

                for(let action in this.actions) 
                {

                        this.keys[action] = this.input.keyboard.addKey(this.actions[action].code);

            remapAction(actionName) 
            {
                game.scene.getScene("Settings").remapping = true;
                
                if(this.input.keyboard.listenerCount("keydown") > 0 || this.input.keyboard.listenerCount("pointerdown") > 0) 
                {
                    this.input.off("pointerdown");
                    this.input.keyboard.off("keydown");
                }
                
                if(this.lastRemapBindAttempt === game.scene.getScene("Settings").buttonBeingRemapped)
                {
                    game.scene.getScene("Settings").buttonBeingRemapped = null;
                    this.lastRemapBindAttempt = null;
                    game.scene.getScene("Settings").remapping = false;
                    game.scene.getScene("Settings").refresh();
                    return;
                }
                else
                {
                    this.lastRemapBindAttempt = game.scene.getScene("Settings").buttonBeingRemapped;
                }
    
                this.input.keyboard.once("keydown", (event) => 
                {
                    this.input.off("pointerdown");
                    game.scene.getScene("Settings").buttonBeingRemapped = null;
                    this.lastRemapBindAttempt = null;
                    game.scene.getScene("Settings").remapping = false;

                    if(event.keyCode !== Phaser.Input.Keyboard.KeyCodes.ESC)
                    {
                        this.updateBinding(actionName, "KEY", event.keyCode);
                        
                        const newKey = this.keys[actionName];
        
                        if(newKey)
                        {
                            newKey.isDown = true;
                            newKey.timeDown = this.time.now;
                        }
                        
                        game.scene.getScene("Settings").refresh();

                        if(this.scene.isActive("MainMenu"))
                        {
                            game.scene.getScene("MainMenu").refreshControls();
                        }

                        canPlayAudio(this) && this.sound.play("mainmenuclick", { rate: 2 });
                    }
                });

                this.input.once("pointerdown", (pointer) => 
                {
                    this.input.keyboard.off("keydown");
                    game.scene.getScene("Settings").buttonBeingRemapped = null;
                    this.lastRemapBindAttempt = null;
                    game.scene.getScene("Settings").remapping = false;

                    if(event.keyCode !== Phaser.Input.Keyboard.KeyCodes.ESC)
                    {
                        this.updateBinding(actionName, "MOUSE", pointer.button);
                        game.scene.getScene("Settings").refresh();

                        if(this.scene.isActive("MainMenu"))
                        {
                            game.scene.getScene("MainMenu").refreshControls();
                        }

                        canPlayAudio(this) && this.sound.play("mainmenuclick", { rate: 2 });
                    }
                }); 
            }
            
            updateBinding(actionName, type, value) 
            {
                if(type === "KEY") 
                {
                    this.actions[actionName] = { type: "KEY", code: value };
                } 
                else 
                {
                    this.actions[actionName] = { type: "MOUSE", button: value };
                }
                
                this.refreshControls();

                localStorage.setItem("HCGameControls", JSON.stringify(this.actions));
            }
            
            isActionActive(actionName) 
            {
                const binding = this.actions[actionName];

                if(binding.type === "KEY") 
                {
                    return this.keys[actionName].isDown;
                }

                if(binding.type === "MOUSE") 
                {
                    const pointer = this.input.activePointer;
                    
                    let isDown = false;
                    if(binding.button === 0) isDown = pointer.leftButtonDown();
                    else if(binding.button === 1) isDown = pointer.middleButtonDown();
                    else if(binding.button === 2) isDown = pointer.rightButtonDown();

                    if(isDown) 
                    {
                        if(binding.button === 0 && this.leftMouseTimeStamp === 0) this.leftMouseTimeStamp = this.time.now;
                        else if(binding.button === 1 && this.middleMouseTimeStamp === 0) this.middleMouseTimeStamp = this.time.now;
                        else if(binding.button === 2 && this.rightMouseTimeStamp === 0) this.rightMouseTimeStamp = this.time.now;                        
                    } 
                    else 
                    {
                        if(binding.button === 0) this.leftMouseTimeStamp = 0;
                        else if(binding.button === 1) this.middleMouseTimeStamp = 0;
                        else if(binding.button === 2) this.rightMouseTimeStamp = 0;           
                    }
                    
                    if(disableUncleanMouseActions)
                    {
                        if(actionName === "jump" || actionName === "block" || actionName === "useShotgun" || actionName === "usePistol")
                        {
                            return false;
                        }
                    }
                    
                    return isDown;
                }

                return false;
            }
            
            timeActionWasActive(actionName)
            {
                const binding = this.actions[actionName];
                
                if(binding.type === "KEY") 
                {
                    return this.keys[actionName].timeDown;
                }
                
                if(binding.type === "MOUSE") 
                {
                    const pointer = this.input.activePointer;
                    if(binding.button === 0) return this.leftMouseTimeStamp;
                    if(binding.button === 1) return this.middleMouseTimeStamp;
                    if(binding.button === 2) return this.rightMouseTimeStamp;
                }
                
                return 0;
            }

        class HUD extends Phaser.Scene
        {
            constructor()
            {
                super({ key: "HUD" });
            }

            create()
            {
                this.gameManager = game.scene.getScene("GameManager");

                this.toggleHUD();
            }
            
            displayGameMode()
            {
                this.gameMode = createText(this, 200, 5, this.gameManager.gameMode, 10, "#ff0000").setOrigin(0.5, 0).setDepth(1232300);
            }
            
            destroyGameMode()
            {
                if(this.gameMode)
                {
                    this.gameMode.destroy();
                    this.gameMode = null;
                }
            }
            
            updateGameMode()
            {
                if(this.gameMode)
                {
                    this.gameMode.setText(this.gameManager.gameMode);
                }
            }
            
            toggleHUD()
            {
                if(this.gameManager.HUDSetting === "All")
                { 
                    this.destroyHighScore();
                    this.destroyCurrentScore();
                    this.destroyGameMode();
                    this.displayHighScore();
                    this.displayCurrentScore();
                    this.displayGameMode();
                }
                else if(this.gameManager.HUDSetting === "Score-Only")
                {
                    this.destroyHighScore();
                    this.destroyCurrentScore();
                    this.destroyGameMode();
                    this.displayHighScore();
                    this.displayCurrentScore();
                }
                else if(this.gameManager.HUDSetting === "Off")
                {
                    this.destroyHighScore();
                    this.destroyCurrentScore();
                    this.destroyGameMode();
                }
            }
            
            refreshHUD()
            {
                if(this.gameManager.HUDSetting === "All")
                { 
                    this.destroyHighScore();
                    this.destroyCurrentScore();
                    this.destroyGameMode();
                    this.displayHighScore();
                    this.displayCurrentScore();
                    this.displayGameMode();
                }
                else if(this.gameManager.HUDSetting === "Score-Only")
                {
                    this.destroyHighScore();
                    this.destroyCurrentScore();
                    this.destroyGameMode();
                    this.displayHighScore();
                    this.displayCurrentScore();
                }
                else if(this.gameManager.HUDSetting === "Off")
                {
                    this.destroyHighScore();
                    this.destroyCurrentScore();
                    this.destroyGameMode();
                }
            }
            
            displayCurrentScore()
            {
                this.currentScore = createText(this, 5, 5, "Score: " + this.gameManager.score, 10, "#ff0000").setOrigin(0, 0).setDepth(1232300);
                this.updateScore();
            }
            
            destroyCurrentScore()
            {
                if(this.currentScore)
                {
                    this.currentScore.destroy();
                    this.currentScore = null;
                }
            }
            
            displayHighScore()
            {
                this.highScore = createText(this, this.game.config.width - 5, 5, "High Score: " + this.gameManager.highScore, 10, "#ff0000").setOrigin(1, 0).setDepth(1232300);
                this.updateHighScore();
            }
            
            destroyHighScore()
            {
                if(this.highScore)
                {
                    this.highScore.destroy();
                    this.highScore = null;
                }
            }
            
            updateHighScore()
            {
                if(this.highScore)
                {
                    if(this.gameManager.gameMode === "Classic")
                    {
                        this.highScore.setText("High Score: " + this.gameManager.highScore);
                    }
                    else if(this.gameManager.gameMode === "Standard")
                    {
                        this.highScore.setText("High Score: " + this.gameManager.experimentalHighScore);
                    }
                    else if(this.gameManager.gameMode === "Easy")
                    {
                        this.highScore.setText("High Score: " + this.gameManager.easyHighScore);
                    }
                }
            }
            
            updateScore()
            {
                if(this.currentScore)
                {
                    this.currentScore.setText("Score: " + this.gameManager.score);
                }
            }

            update(time)
            {
                
            }
        }
        
        class Settings extends Phaser.Scene
        {
            constructor()
            {
                super({ key: "Settings" });
                this.remapping = false;
            }
            
            refresh()
            {
                for(let i = 0; i < 2; i++)
                {
                    this.toggleMenu();
                }
            }
            
            toggleMenu()
            {
                if(this.displayedSettings)
                {
                    this.displayedSettings = false;
                    this.destroySettings();
                    
                }
                else
                {
                    this.displayedSettings = true;
                    this.displaySettings();
                    
                }
            }
            
            create()
            {
                this.keyNameLookup = Object.fromEntries(Object.entries(Phaser.Input.Keyboard.KeyCodes).map(([name, code]) => [code, name]));
                this.gameManager = this.scene.get("GameManager");
                this.gameModeWords = this.gameManager.gameMode;
                this.HUD = this.scene.get("HUD");
                
                this.wasd =
                {
                    esc: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ESC)
                };
                
                this.displayedSettings = false;
            }
            
            manualToggleMenu()
            {
                canPlayAudio(this) && this.sound.play("mainmenuclick", { rate: Phaser.Math.FloatBetween(0.75, 1) });

                if(this.displayedSettings)
                {
                    this.displayedSettings = false;
                    
                    if(this.gameModeWords !== this.gameManager.gameMode)
                    {
                        this.gameManager.score = 0; 
                        this.gameManager.switchGameMode(this.gameModeWords);

                        if(this.scene.isActive("HUD"))
                        {
                            this.HUD.updateScore();
                            this.HUD.updateHighScore();
                            this.HUD.updateGameMode();
                        }
                        
                        if(this.canRestartToLevel1)
                        {
                            this.canRestartToLevel1 = false;
                            
                            if(!this.scene.isActive("MainMenu"))
                            {
                                restartToLevel1(this);
                            }
                        }
                       
                    }

                    this.destroySettings();
                }
                else
                {
                    this.displayedSettings = true;
                    this.canRestartToLevel1 = true;
                    this.displaySettings();
                }
            }
            
            update()
            {
                if(Phaser.Input.Keyboard.JustDown(this.wasd.esc))
                {
                    this.manualToggleMenu();
                }
                
                if(this.displayedSettings)
                {
                    if(this.remapButtons)
                    {
                        this.remapButtons.forEach(button => 
                        {
                            if(button)
                            {
                                if(button.active)
                                {
                                    if(!this.remapping)
                                    {
                                        if(button.getBounds().contains(this.input.activePointer.x, this.input.activePointer.y)) 
                                        {
                                            button.setColor("#ffffff");
                                        }   
                                        else
                                        {
                                            button.setColor("#ff0000");
                                        }
                                    } 
                                    else
                                    {
                                        if(button !== this[this.buttonBeingRemapped])
                                        {
                                            button.setColor("#800000");
                                        }
                                        else
                                        {
                                            button.setColor("#00ff00");
                                        }
                                    }
                                }
                            }
                        });
                    }
                    
                    if(this.buttons)
                    {
                        this.buttons.forEach(button => 
                        {
                            if(button)
                            {
                                if(button.active)
                                {
                                    if(button.getBounds().contains(this.input.activePointer.x, this.input.activePointer.y)) 
                                    {
                                        button.setColor("#ffffff");
                                    }   
                                    else
                                    {
                                        button.setColor("#ff0000");
                                    }
                                }
                            }
                        });
                    }
                }
            }

                    else if(this.gameManager.bloodType === "Classic-Subtle")
                    {
                        this.gameManager.bloodType = "Classic-V2";
                    }
                    else if(this.gameManager.bloodType === "Classic-V2")
                    {
                        this.gameManager.bloodType = "Classic-V2-Subtle";
                    }
                    else if(this.gameManager.bloodType === "Classic-V2-Subtle")
                    {
                        this.gameManager.bloodType = "Standard";
                    }*/
                    
                    if(checkStorage() === true)
                    {
                        localStorage.setItem("HCBloodType", this.gameManager.bloodType);
                    }
                    
                    let sceneCultIsIn = null;
                    
                    if(game.scene.isActive("MainMenu"))
                    {
                        sceneCultIsIn = "MainMenu";
                    }
                    else if(game.scene.isActive("Level1Game"))
                    {
                        sceneCultIsIn = "Level1Game";
                    }
                    else if(game.scene.isActive("Level2Game"))
                    {
                        sceneCultIsIn = "Level2Game";
                    }
                    else if(game.scene.isActive("Level3Game"))
                    {
                        sceneCultIsIn = "Level3Game";
                    }
                    else if(game.scene.isActive("Level4Game"))
                    {
                        sceneCultIsIn = "Level4Game";
                    }

                    if(sceneCultIsIn !== null)
                    {
                        if(game.scene.getScene(sceneCultIsIn).cults && game.scene.getScene(sceneCultIsIn).cults.active)
                        {
                           game.scene.getScene(sceneCultIsIn).cults.children.entries.forEach((cult) =>
                           {
                               if(cult.active)
                               {
                                   cult.createBlood();
                               }
                           });
                        }
                        
                        if(game.scene.getScene(sceneCultIsIn).cultKnifes && game.scene.getScene(sceneCultIsIn).cultKnifes.active)
                        {
                           game.scene.getScene(sceneCultIsIn).cultKnifes.children.entries.forEach((cultKnife) =>
                           {
                               if(cultKnife.active)
                               {
                                   cultKnife.createBlood();
                               }
                           });
                        }
                    }
                    
                    if(this.gameManager.bloodType === "Standard-Subtle")
                    {
                        this.changeBloodWords = "Standard";
                    }
                    else if(this.gameManager.bloodType === "Small-Subtle")
                    {
                        this.changeBloodWords = "Small";
                    }
                    else if(this.gameManager.bloodType === "Off")
                    {
                        this.changeBloodWords = "Off";
                    }
                    else if(this.gameManager.bloodType === "Classic")
                    {
                        this.changeBloodWords = "Classic";
                    }
                    else if(this.gameManager.bloodType === "Classic-V2-Subtle")
                    {
                        this.changeBloodWords = "Classic-V2";
                    }
                    this.changeBlood.setText("Blood Style: " + this.changeBloodWords);
                    canPlayAudio(this) && this.sound.play("mainmenuclick", { rate: Phaser.Math.FloatBetween(0.75, 1) });
                });
                
                this.extraGibsWords = this.gameManager.extraGibs;
                
                this.extraGibs = createText(this, 5, 25 + this.gameSettings.height + this.gameMode.height + this.toggleHUD.height + this.toggleScreenShake.height + this.toggleCrosshairMotion.height + this.changeBlood.height, "Gibs: " + this.extraGibsWords, 10, "#ff0000").setOrigin(0, 0).setDepth(1232300);
                this.extraGibs.setInteractive({cursor: "pointer"});
                this.extraGibs.on("pointerdown", () =>
                {
                    if(this.gameManager.extraGibs === "All")
                    {
                        this.gameManager.extraGibs = "Cultists-Only";
                    }
                    else if(this.gameManager.extraGibs === "Cultists-Only")
                    {
                        this.gameManager.extraGibs = "Eyes-Only";
                    }
                    else if(this.gameManager.extraGibs === "Eyes-Only")
                    {
                        this.gameManager.extraGibs = "Off";
                    }
                    else if(this.gameManager.extraGibs === "Off")
                    {
                        this.gameManager.extraGibs = "All";
                    }
                    
                    this.extraGibsWords = this.gameManager.extraGibs;
                    
                    this.extraGibs.setText("Gibs: " + this.extraGibsWords);
                    
                    if(checkStorage() === true)
                    {
                        localStorage.setItem("HCExtraGibs", this.gameManager.extraGibs);
                    }
                
                    canPlayAudio(this) && this.sound.play("mainmenuclick", { rate: Phaser.Math.FloatBetween(0.75, 1) });
                });
                
                if(this.gameManager.playerSkin === "player")
                {
                    this.changeSkinWords = "Standard";
                }
                else if(this.gameManager.playerSkin === "playerchromeshotgun")
                {
                    this.changeSkinWords = "Tactical";
                }
                else if(this.gameManager.playerSkin === "playerzombiehunter")
                {
                     this.changeSkinWords = "Zombie-Hunter";
                }
                else if(this.gameManager.playerSkin === "playercontracted")
                {
                     this.changeSkinWords = "Contracted";
                }
                else if(this.gameManager.playerSkin === "playerclear")
                {
                     this.changeSkinWords = "Apple";
                }
                else if(this.gameManager.playerSkin === "playerneon")
                {
                     this.changeSkinWords = "Candy";
                }
                
                this.changeSkin = createText(this, 5, 28 + this.gameSettings.height + this.gameMode.height + this.toggleHUD.height + this.toggleScreenShake.height + this.toggleCrosshairMotion.height + this.changeBlood.height + this.extraGibs.height, "Skin: " + this.changeSkinWords, 10, "#ff0000").setOrigin(0, 0).setDepth(1232300);
                this.changeSkin.setInteractive({cursor: "pointer"});
                this.changeSkin.on("pointerdown", () =>
                {
                    this.gameManager.changePlayerSkin();
                    
                    if(this.gameManager.playerSkin === "player")
                    {
                        this.changeSkinWords = "Standard";
                    }
                    else if(this.gameManager.playerSkin === "playerchromeshotgun")
                    {
                        this.changeSkinWords = "Tactical";
                    }
                    else if(this.gameManager.playerSkin === "playerzombiehunter")
                    {
                         this.changeSkinWords = "Zombie-Hunter";
                    }
                    else if(this.gameManager.playerSkin === "playercontracted")
                    {
                         this.changeSkinWords = "Contracted";
                    }
                    else if(this.gameManager.playerSkin === "playerclear")
                    {
                         this.changeSkinWords = "Apple";
                    }
                    else if(this.gameManager.playerSkin === "playerneon")
                    {
                         this.changeSkinWords = "Candy";
                    }
                    
                    this.changeSkin.setText("Skin: " + this.changeSkinWords);
                    canPlayAudio(this) && this.sound.play("mainmenuclick", { rate: Phaser.Math.FloatBetween(0.75, 1) });
                });
                
                this.hasRestartedGame = false;
                
                this.restartGame = createText(this, 5, 176 - 5, "MAIN MENU", 8, "#ff0000").setOrigin(0, 1).setDepth(1232300);
                this.restartGame.setInteractive({cursor: "pointer"});
                this.restartGame.on("pointerdown", () =>
                {
                    if(this.hasRestartedGame === false)
                    {
                        this.hasRestartedGame = true;
                        if(this.displayedSettings)
                        {
                            this.displayedSettings = false;
                            this.destroySettings();
                        }

                        this.gameManager.resetMappingInProgress();
                        this.gameManager.score = 0; 
                        this.gameManager.switchGameMode(this.gameModeWords);
                        canPlayAudio(this) && this.sound.play("mainmenuclick", { rate: Phaser.Math.FloatBetween(0.75, 1) });
                        disableUncleanMouseActions = true;
                        restartToMainMenu(this);
                    }
                });
                
                this.background = this.add.rectangle(200, 0, 400, 176, "#000000").setOrigin(0.5, 0).setAlpha(0.8); 
                this.remapButtons = [this.walkLeft, this.walkRight, this.jump, this.block, this.useShotgun, this.usePistol];
                this.buttons = [this.resetDefault, this.gameMode, this.toggleHUD, this.toggleScreenShake, this.toggleCrosshairMotion, this.changeSkin, this.restartGame, this.changeBlood, this.extraGibs];
            }
            
            getActionAssignment(actionName)
            {
                let currentAction = this.gameManager.actions[actionName];
                
                if(currentAction.type === "KEY") 
                {
                    let name = this.keyNameLookup[currentAction.code];
                    
                    if(name === "LEFT")
                    {
                        return "Left-Arrow";
                    }
                    else if(name === "RIGHT")
                    {
                        return "Right-Arrow";
                    }
                    else if(name === "UP")
                    {
                        return "Up-Arrow";
                    }
                    else if(name === "DOWN")
                    {
                        return "Down-Arrow";
                    }
                    
                    try
                    {
                        return name.split("_").map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join("-");
                    }
                    catch(e)
                    {
                        return name;
                    }
                    
                } 
                else 
                {
                    if(currentAction.button === 0)
                    {
                        return "Left-Mouse";
                    }
                    else if(currentAction.button === 1)
                    {
                        return "Middle-Mouse";
                    }
                    else if(currentAction.button === 2)
                    {
                        return "Right-Mouse";
                    }
                    else
                    {
                        return "undefined";
                    }
                }
            }
            
            destroySettings()
            {
                this.settings.destroy();
                this.background.destroy();
                this.walkLeft.destroy();
                this.walkRight.destroy();
                this.jump.destroy();
                this.useShotgun.destroy();
                this.block.destroy();
                this.usePistol.destroy();
                this.resetDefault.destroy();
                this.gameSettings.destroy();
                this.gameMode.destroy();
                this.toggleHUD.destroy();
                this.toggleScreenShake.destroy();
                this.toggleCrosshairMotion.destroy();
                this.restartGame.destroy();
                this.changeSkin.destroy();
                this.changeBlood.destroy();
                this.extraGibs.destroy();
            }
        }
        
        function canPlayAudio(scene)
        {
            if(scene.sound.context.state === "running" )
            {
                return true;
            }
            else
            {
                return false;
            }
        }
        
        function checkStorage()
        {
            var test = "test";
    
            try 
            {
                localStorage.setItem(test, test);
                localStorage.removeItem(test);
                return true;
            } 
            catch(e)
            {
                return false;
            }
        }
        
        document.addEventListener("contextmenu", event => 
        {
            event.preventDefault();
            return false;
        });
  
        const config =
        {
            type: Phaser.AUTO,
            pixelArt: true,
            width: Math.max(400, Math.min(400, (window.innerWidth / window.innerHeight) * 176)),
            height: 176,
    
            scale:
            {
              mode: Phaser.Scale.FIT,
              autoCenter: Phaser.Scale.CENTER_BOTH
            },

            physics:
            {
              default: "arcade",
              arcade:
              {
                gravity: { y: 300 },
                debug: false
              }
            },
            
            input:
            {
                mouse:
                {
                    target: window
                }
            },

            scene:
            [
              Loading,
              MainMenu,
              GameManager,
              UpgradeRoom,
              Level1Game,
              Level2Game,
              Level3Game,
              Level4Game,
              HUD,
              Settings,
              Crosshair
            ]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
