<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Follower</title>
  <meta name="description" content="2d video game">
  <script src="./assets/phaser4.min.js"></script>
  <link rel="shortcut icon" type="image" href="">
  <style type="text/css">
    canvas{
        /*cursor: none !important;*/
    }
      
    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: blue;
      overflow: hidden;
    }
  </style>
</head>
<body>
    <script type="text/javascript" src="./player.js"></script>
    <script type="text/javascript" src="./keyboardManager.js"></script>
    <script type="text/javascript">

        class Loading extends Phaser.Scene
        {
            constructor()
            {
              super({key: "Loading"});
            }

            preload()
            {
                this.load.spritesheet("player", "./assets/playerc.png", {frameWidth: 16, frameHeight: 16});
                this.load.image("sky", "./assets/sky.png");
                this.load.image("ground", "./assets/ground.png");
                this.load.image("brick", "./assets/brick.png");
                this.load.image("brickstairs", "./assets/brickstairs.png");
            }

            create()
            {
                //this.loading = this.add.text((this.sys.game.config.width / 2), this.sys.game.config.height / 2, "Loading", { fontFamily: "hcfont", fontSize: "16px", fill: "#fff" }).setOrigin(0.5);
            }

            update()
            {
                this.scene.start("GameManager");
                this.scene.start("Level1");
            }
        }
        
        class GameManager extends Phaser.Scene
        {
            constructor()
            {
                super({ key: "GameManager" });
            }
            
            create()
            {
                
            }
        }
        
    
        class Level1 extends Phaser.Scene
        {
            constructor()
            {
              super({key: "Level1"});
            }

            preload()
            {
                
            }

            create ()
            {
                this.input.setDefaultCursor("");
                const worldWidthX = 1800;
                this.physics.world.setBounds(0, 0, worldWidthX, 176);
                this.cursors = this.input.keyboard.createCursorKeys();
                
                this.brick = this.add.tileSprite(0, 90, 1800, 180, "sky").setOrigin(0, 1).setScrollFactor(0.6);
                
                this.floor = this.add.tileSprite(0, 90, 1800, 16, "ground").setOrigin(0, 1);
                this.physics.add.existing(this.floor, true);
                
                this.player = createPlayer(this);

                if(this.player)
                {
                    this.physics.add.collider(this.player, this.floor);
                }
                
                this.cameras.main.setBounds(0, 0, worldWidthX, 176);
                this.cameras.main.startFollow(this.player, true, 1, 1, 0, this.sys.game.config.height / 2);
                this.cameras.main.setZoom(1);
                this.cameras.scrollX = 0;
                this.cameras.scrollY = 0;
            }
            
            update(time, delta)
            {
                
            }
        }
  
        function createText(scene, x, y, words, size, color)
        {
            let newText = scene.add.text(x, y, words, { fontFamily: "hcfont", fontSize: size, fill: color}).setOrigin(0.5, 0);
            return newText;
        }
        
        function canPlayAudio(scene)
        {
            if(scene.sound.context.state === "running" )
            {
                return true;
            }
            else
            {
                return false;
            }
        }
        
        function checkStorage()
        {
            var test = "test";
    
            try 
            {
                localStorage.setItem(test, test);
                localStorage.removeItem(test);
                return true;
            } 
            catch(e)
            {
                return false;
            }
        }
        
        document.addEventListener("contextmenu", event => 
        {
            event.preventDefault();
            return false;
        });
  
        const config =
        {
            type: Phaser.AUTO,
            pixelArt: true,
            width: 160,
            height: 90,
    
            scale:
            {
              mode: Phaser.Scale.FIT,
              autoCenter: Phaser.Scale.CENTER_BOTH
            },

            physics:
            {
              default: "arcade",
              arcade:
              {
                gravity: { y: 300 },
                debug: false
              }
            },

            scene:
            [
              Loading,
              GameManager,
              Level1
            ]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
